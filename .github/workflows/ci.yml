name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Read-only by default: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    # The program ships for Linux, macOS and Windows: paths, the data
    # directory and the editor plugins' lookups differ between them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      # The race detector needs cgo, which only the Linux runner has set
      # up out of the box; elsewhere the plain tests run.
      - if: runner.os == 'Linux'
        run: make test-race
      - if: runner.os != 'Linux'
        run: go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # "stable", not go.mod: golangci-lint is a dev tool whose own Go
      # floor moves independently of this module's.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - run: make lint
      - run: make arch-lint

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make vuln

  markdown:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: make lint-md
