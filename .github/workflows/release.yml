name: Release

# A CLI tag (v0.1.0, v1.2.3) builds the binaries for Linux, macOS and
# Windows and attaches them to a GitHub release. The editor plugins have
# their own tags and workflows (vscode-v*, sublime-*), which "v[0-9]*"
# leaves out even though "vscode-v..." also starts with a v.
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make test

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The plugins' tags may point at the same commit; name the one
          # that triggered this run.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
